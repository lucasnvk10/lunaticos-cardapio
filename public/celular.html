<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lunáticos · Prévia no celular</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eceae6;color:#242424;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:26px 16px}header{text-align:center;max-width:540px}header small{font-size:11px;font-weight:800;letter-spacing:.12em;color:#aa4300}h1{font-size:26px;letter-spacing:-.045em;margin:8px 0}p{font-size:13px;color:#666;line-height:1.6}nav{display:flex;justify-content:center;gap:10px;margin:18px 0}button,a{padding:11px 18px;border:1px solid #d5d0c9;border-radius:12px;background:white;color:#333;font:700 13px system-ui;text-decoration:none;cursor:pointer}button.active{background:#ff5b00;border-color:#ff5b00;color:white}.phone{width:410px;max-width:100%;padding:10px;border-radius:42px;background:#181818;box-shadow:0 20px 65px #0002}.screen{position:relative;overflow:hidden;border-radius:32px;background:white}iframe{display:block;border:0;width:100%;height:780px;background:#fff}.bar{background:#181818;color:#fff;font-size:10px;display:flex;justify-content:space-between;padding:4px 24px 12px}.home{height:18px;display:grid;place-items:center}.home:after{content:'';width:110px;height:4px;border-radius:10px;background:#777}footer{font-size:11px;color:#777;margin:20px 0}@media(max-width:480px){body{padding:12px 8px}h1{font-size:22px}.phone{width:100%;padding:7px}iframe{height:75vh}nav{margin:12px 0}nav a{display:none}}</style>
</head><body><header><small>LUNÁTICOS · EVENTOS</small><h1>O app em uma tela de celular</h1><p>Prévia responsiva com o app real deste ambiente local. Navegue, cadastre o estoque e acompanhe os avisos.</p><nav><button id="menu" onclick="go('/',this)">Cardápio</button><button id="team" class="active" onclick="go('/equipe?view=overview',this)">Gestão</button><a href="/equipe?view=overview" target="_blank">Abrir em tela cheia</a></nav></header><div class="phone"><div class="bar"><span>Prévia local</span><span>390 px · celular</span></div><div class="screen"><iframe id="app" src="/equipe?view=overview" title="Aplicativo Lunáticos em tela de celular"></iframe></div><div class="home"></div></div><footer>Esta prévia simula o tamanho da tela. Não substitui um teste em aparelho físico.</footer><script>function go(path,button){document.getElementById('app').src=path;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b===button))}</script></body></html>
